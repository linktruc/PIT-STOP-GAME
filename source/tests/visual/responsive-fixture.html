<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>V19 layout visual fixture</title>
<link rel="stylesheet" href="../../src/styles.css"><link rel="stylesheet" href="../../src/game.css"><link rel="stylesheet" href="../../src/v8.css"><link rel="stylesheet" href="../../src/v9.css"><link rel="stylesheet" href="../../src/v10-ui.css"><link rel="stylesheet" href="../../src/v11-hud.css"><link rel="stylesheet" href="../../src/chain.css"><link rel="stylesheet" href="../../src/v11-workflow.css"><link rel="stylesheet" href="../../src/v11-desktop.css"><link rel="stylesheet" href="../../src/v11-4-ui.css"><link rel="stylesheet" href="../../src/v13-responsive-desktop.css"><link rel="stylesheet" href="../../src/v10-replay.css"><link rel="stylesheet" href="../../src/v15-ui.css"><link rel="stylesheet" href="../../src/v17-layout.css"><link rel="stylesheet" href="../../src/v18-ui.css"><link rel="stylesheet" href="../../src/v19-fluid-layout.css">
<link rel="stylesheet" href="../../src/v20-polish.css"><style>.scene-stage{background:linear-gradient(125deg,#2b3941,#42535b,#202e37)!important}.scene-instruments .mini-chain{pointer-events:auto}.mock-figure{position:absolute;left:46%;top:42%;font-size:8vmin;opacity:.17}.mock-layout button{pointer-events:auto}.replay-view{background:linear-gradient(145deg,#31434d,#202f3c)}</style></head>
<body><main id="fixture-root"></main><script>
const root=document.getElementById('fixture-root');const mode=new URLSearchParams(location.search).get('mode')||'menu';
const stages=['Lift car','Loosen wheel nuts','Remove old wheels','Fit new wheels','Tighten wheel nuts','Lower car','Release car'];
const status=(i)=>i<2?'done':i===2?'available':'locked';
const mini=`<button class="mini-chain rolling-chain live-workflow milestone-workflow" ><span class="rail-meta"><span>2 wheel crews active</span><b><span>04/21</span> WORKFLOW ↗</b></span><span class="rail-summary">Parallel jobs · progress summary</span><span class="rail-viewport"><span class="milestone-rail milestone-track" >${stages.map((s,i)=>`<span class="rail-milestone grouped-milestone ${status(i)}"><span class="rail-tick">✓</span><span class="rail-group-parts"><span class="rail-part">FL✓</span><span class="rail-part">FR✓</span><span class="rail-part">RL✓</span><span class="rail-part">RR✓</span></span><span class="rail-action">${s}</span></span>`).join('')}</span></span><span class="rail-total"><span class="rail-total-fill"></span></span></button>`;
const menu=`<section class="main-menu has-saved-team"><h1>PIT STOP.<br><span>SIMULATOR.</span></h1><div class="menu-actions"><div class="menu-seat"><div class="team-seat-actions"><button class="game-button resume contextual-resume"><span class="resume-copy"><strong>Resume as long username</strong><small>in APEX 07 Pit Crew</small></span></button><button class="game-button secondary leave-from-menu">Leave Team</button></div><p class="saved-seat-note">Your place is saved while you visit the menu.</p></div><button class="game-button primary">Create Team</button><button class="game-button secondary">Browse Teams</button><button class="game-button secondary">Watch Live</button><div class="menu-secondary"><button>Leaderboard</button><button>How to play</button><button>All Roles</button><button>Admin access</button></div><button class="solo-test-button">Solo Test <span>LOCAL · NOT RANKED</span></button></div></section>`;
const head=`<header class="top-hud"><button class="game-button small back-menu">Main Menu</button><div class="race-timer"><span>AWAITING CREW</span><strong>0.000<small>s</small></strong><em>IN POSITION</em></div><div class="top-controls"><button class="leave-crew-control">Leave Team</button><button class="icon-control">◈</button><button class="icon-control">♪</button><button class="icon-control">☷</button></div></header>`;
const dock=`<div class="hud-dock"><div class="role-card role-strip"><span class="role-identity"><span>YOUR ROLE</span><h2>Front jack operator</h2></span><button class="role-details-toggle">Tap for details</button></div><div class="action-console"><div class="solo-role-picker"><span>Choose role</span><select><option>Front jack operator</option></select></div><div class="ready-status">0/1 READY <small>One human · 14 bots</small></div><button class="game-button gold ready-button">Mark ready</button><button class="game-button primary start-button">Start round</button><span class="start-explanation">Choose your role. Ready, then start.</span></div></div>`;
const replay=`<section class="replay-view"><div class="mock-figure">🏎 PIT STOP</div><header class="replay-heading"><div><small>LOCAL · UNRANKED REPLAY</small><strong>SOLO TEST — NOT RANKED</strong></div><nav><button>Sound on</button><button>Close replay</button></nav></header><div class="replay-controls"><div class="replay-event-chip"><strong>Release car</strong><span>Bot · Release controller</span><span class="event-chip-times">0.44s step · 11.7s team</span></div><input type="range" class="replay-scrubber"><div class="replay-buttons"><button>Pause</button><button>Restart</button><button>×1</button><time>3.8s</time><button>Event Log</button></div></div></section>`;
root.innerHTML=`<div class="game-shell view-${mode==='replay'?'crew':mode==='menu'?'menu':'crew'} mock-layout" style="--hud-bottom:14px;--hud-edge:24px;--pit-overlay-bottom:0px"><div class="scene-stage"><div class="mock-figure">🏎 PIT STOP</div></div>${head}${mode==='menu'?menu:mode==='crew'?`<div class="room-heading"><h2>SOLO TEST — NOT RANKED</h2></div><aside class="scene-instruments">${mini}<section class="desktop-live-log"><header><strong>EVENT LOG</strong><span>LIVE</span></header><div class="desktop-event-scroll"><ol><li>Loosen wheel nuts · 1.02s</li></ol></div></section></aside>${dock}`:replay}</div>`;

const box=document.querySelector('.mini-chain');
if(box){const rail=box.querySelector('.rail-viewport'),track=box.querySelector('.milestone-track');const v=getComputedStyle(box).getPropertyValue('--workflow-direction').trim()==='vertical';
const size=v?Math.max(40,rail.getBoundingClientRect().height/4):Math.max(95,rail.getBoundingClientRect().width/3);
track.style.gridAutoRows=v?size+'px':'auto';track.style.gridAutoColumns=v?'auto':size+'px';track.style.transform=v?`translate3d(0,${-size}px,0)`:`translate3d(${-size}px,0,0)`;}
</script></body></html>
