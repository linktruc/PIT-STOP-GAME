<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#132532;color:white}#scene{width:900px;height:700px}#cards{display:grid;grid-template-columns:repeat(2,360px);gap:8px}canvas.live{width:360px;height:202px}</style>
<div id="scene" hidden></div><div id="cards"></div>
<script type="module">
import {PreviewPool} from '/src/TeamPreviews.tsx';
import {createPitGarageScene} from '/src/scene/garage.ts';
import {createSoloRound} from '/src/engine.ts';
const player={id:'you',role:'FL_GUNNER',nickname:'Human',joinedAt:0,ready:false};
const makeRoom=(id,now)=>({id,teamId:id,name:id,color:'#f4493b',code:id,hostId:'you',status:'RUNNING',players:[player],updatedAt:now,round:createSoloRound([player],Math.max(0,now-6000),id)});
let pool,view,clock=10000;
window.initHighlights=()=>{
 document.querySelector('#scene').hidden=false;window.requestAnimationFrame=()=>0;
 view=createPitGarageScene(document.querySelector('#scene'),{quality:'low'});
 return window.stageHighlights('WAITING');
};
window.stageHighlights=(status,at=11000)=>{
 const room=makeRoom('highlight',0);room.status=status;room.round.penalties={you:{at:10000,until:12000}};
 view.update(room,'you',true,at);view.render(clock+=100);
 const scene=document.querySelector('#scene');return {crew:JSON.parse(scene.dataset.crewHighlights),labels:[...scene.querySelectorAll('.crew-lockout-tag')].filter(e=>e.style.display!=='none').map(e=>e.textContent)};
};
window.initPreviews=(count=2)=>{
 pool?.dispose();const cards=document.querySelector('#cards');cards.replaceChildren();pool=new PreviewPool();
 for(let i=0;i<count;i++){const c=document.createElement('canvas');c.className='live';cards.append(c);pool.add(c,makeRoom('room-'+i,Date.now()));}
 return true;
};
window.previewStats=()=>[...pool.entries].map(([canvas,e])=>({frames:Number(canvas.dataset.previewFrames??0),mode:canvas.dataset.previewMode,visible:e.visible,view:!!e.view,contexts:canvas.dataset.previewContexts,cost:canvas.dataset.previewRenderMs,width:canvas.width}));
window.stopPreviews=()=>{pool?.dispose();return document.querySelectorAll('.crew-lockout-tag').length;};
</script>
