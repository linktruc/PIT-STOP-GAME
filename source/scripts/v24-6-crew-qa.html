<!doctype html><body><div id="scene" style="width:800px;height:600px"></div><script type="module">
import React from 'react';
import * as THREE from 'three';
import {createRoot} from 'react-dom/client';
import {flushSync} from 'react-dom';
import {NewCrewForm} from '/src/GamePanels.tsx';
import '/src/game.css';
import {TEAM_COLORS} from '/src/teamColors.ts';
import {ROLES} from '/src/types.ts';
import {createPitGarageScene} from '/src/scene/garage.ts';
import {TaskAnimationTimeline} from '/src/scene/animation.ts';
import {createSoloRound,reconcile,submitAction} from '/src/engine.ts';
const complete=(role,delay)=>{
 const r=createSoloRound([{id:'you',role,nickname:'You',ready:true,joinedAt:0}],10000,role);let now=r.goAt;
 for(let i=0;i<100&&r.status!=='COMPLETED';i++){
  reconcile(r,now);now=Math.max(now,Math.min(...r.tasks.filter(t=>t.status==='AVAILABLE').map(t=>t.ownerId?t.enabledAt+delay:t.dueAt??Infinity)));if(!Number.isFinite(now))throw Error('deadlock');reconcile(r,now);
  for(const t of r.tasks.filter(t=>t.ownerId&&t.status==='AVAILABLE'&&t.enabledAt+delay<=now))submitAction(r,'you',t.id,now,t.id);
 }
 return r;
};
window.verifyAudio=()=>{
 const summaries=[];
 for(const role of ['FRONT_JACK','FL_GUNNER','RL_GUNNER','FL_WHEEL_OFF','FL_WHEEL_ON','RELEASE_CONTROLLER']){
  const r=complete(role,36),before=JSON.stringify(r),timeline=new TaskAnimationTimeline();timeline.ingestRecorded(r);
  const events=[];let clock=9000,renderClock=-1;let renders=0;
  const renderer={domElement:document.createElement('canvas'),shadowMap:{},render(){renderClock=clock;renders++;},setSize(){},setPixelRatio(){}};
  const scene=createPitGarageScene(document.querySelector('#scene'),{renderer,manual:true,onTaskCue(id){events.push({id,clock,renderClock,start:JSON.parse(document.querySelector('#scene').dataset.lastTaskCue).startsAt,official:r.tasks.find(t=>t.id===id).completedAt});}});
  const room={id:r.id,teamId:r.id,solo:true,name:'QA',color:'#f00',code:'QA',hostId:'you',status:r.status,players:r.players,round:r,updatedAt:0};
  const end=Math.max(...Array.from(timeline.allReceipts(),r=>r.endsAt))+12000;
  const actualNow=Date.now;Date.now=()=>clock;
  for(;clock<=end;clock+=20){
   const snapshot=structuredClone(room);
   for(const task of snapshot.round.tasks){
    if(task.completedAt>clock){task.completedAt=null;task.status=task.enabledAt<=clock?'AVAILABLE':'LOCKED';}
   }
   scene.update(snapshot,'you',true);scene.render(clock);
   scene.update(structuredClone(snapshot),'you',true);scene.render(clock);
  }
  Date.now=actualNow;
  const summary={role,cues:events.length,unique:new Set(events.map(e=>e.id)).size,early:events.filter(e=>e.clock<e.start||e.renderClock!==e.clock).length,maxDelay:Math.max(...events.map(e=>e.clock-e.start)),queuedAfterOfficial:events.filter(e=>e.start>e.official+100).length,scoreUnchanged:before===JSON.stringify(r),renders};
  const count=events.length;scene.dispose();clock+=5000;scene.render(clock);summary.noCuesAfterDispose=events.length===count;
  summaries.push(summary);
 }
 return summaries;
};
window.verifyColors=()=>{
 let drawn;
 const renderer={domElement:document.createElement('canvas'),shadowMap:{},render(s){drawn=s;},setSize(){},setPixelRatio(){}};
 const view=createPitGarageScene(document.querySelector('#scene'),{renderer,manual:true});
 const room={id:'colors',teamId:'colors',solo:false,name:'Color test',color:'#ff4b3e',code:'QA',hostId:'you',status:'WAITING',players:[],round:null,updatedAt:0};
 const uniforms=()=>{const set=new Set();drawn.traverse(o=>{if(o.material?.name==='crew-suit')set.add(o.material);});return [...set];};
 const others=()=>{const map={};drawn.traverse(o=>{if(o.material?.color&&o.material.name!=='crew-suit')map[o.material.uuid]=o.material.color.getHexString();});return JSON.stringify(map);};
 const result=[];let baseline;
 for(const color of TEAM_COLORS){
  room.color=color;view.update(structuredClone(room),null,true,1000);view.render(1000);
  baseline??=others();
  result.push({color,uniforms:uniforms().length,allMatch:uniforms().filter(m=>m.color.getHexString()===color.slice(1)).length===15,supportUnchanged:uniforms().filter(m=>['577380','2e4659'].includes(m.color.getHexString())).length===7,otherMaterialsUnchanged:others()===baseline});
 }
 room.solo=true;view.update(room,null,true,1000);view.render(1000);
 const soloRestored=uniforms().filter(m=>m.color.getHexString()==='ef3039').length===15;
 view.dispose();return {palettes:result,soloRestored};
};
window.verifyPaletteForm=()=>{
 const host=document.createElement('div');host.style.width='280px';document.body.append(host);
 const root=createRoot(host);let submitted;
 flushSync(()=>root.render(React.createElement(NewCrewForm,{busy:false,configured:true,blocked:false,onSubmit:(name,nick,color)=>submitted=color})));
 const buttons=[...host.querySelectorAll('.accent-picker button')];
 const results=buttons.map(button=>{flushSync(()=>button.click());host.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return {color:submitted,selected:button.getAttribute('aria-pressed')==='true',fits:button.getBoundingClientRect().right<=host.getBoundingClientRect().right+1};});
 root.unmount();host.remove();return {count:buttons.length,unique:new Set(results.map(r=>r.color)).size,allSelected:results.every(r=>r.selected),allFit:results.every(r=>r.fits)};
};
window.verifyTransitions=()=>{
 const reports=[];
 for(const [role,delay] of [['FRONT_JACK',2000],['FL_GUNNER',2000],['FL_GUNNER',36]]){
  const r=complete(role,delay),original=JSON.stringify(r);let clock=9000;
  const renderer={domElement:document.createElement('canvas'),shadowMap:{},render(){},setSize(){},setPixelRatio(){}};
  const host=document.querySelector('#scene'),view=createPitGarageScene(host,{renderer,manual:true});
  const actualNow=Date.now;Date.now=()=>clock;
  const room={id:r.id,teamId:r.id,solo:true,name:'QA',color:'#f4493b',code:'QA',hostId:'you',status:r.status,players:r.players,round:r,updatedAt:0};
  const prior=new Map();let maxHandStep=0,maxGripError=0,waitingFrames=0,maxWaitingHandAboveHead=-Infinity,rearAt450=null,rearBeforeGo=null;
  for(;clock<r.finishedAt+4000;clock+=10){
   const snapshot=structuredClone(room);
   for(const task of snapshot.round.tasks){if(task.completedAt>clock){task.completedAt=null;task.status=task.enabledAt<=clock?'AVAILABLE':'LOCKED';}}
   view.update(snapshot,'you',true);view.render(clock);
   const actors=JSON.parse(host.dataset.crewBodyPositions),rear=actors.find(a=>a.role==='REAR_JACK');
   if(clock===9990)rearBeforeGo={x:rear.x,z:rear.z};
   if(clock===10450)rearAt450=Math.hypot(rear.x,rear.z-4.03);
   maxGripError=Math.max(maxGripError,...Object.values(JSON.parse(host.dataset.heldToolErrors)));
   for(const gun of JSON.parse(host.dataset.gunnerPoses)){
    if(gun.tightenPhase>=.65&&gun.tightenPhase!==null){
     const old=prior.get(gun.role);if(old)for(let i=0;i<2;i++)maxHandStep=Math.max(maxHandStep,Math.hypot(...gun.hands[i].map((v,j)=>v-old[i][j])));
     prior.set(gun.role,gun.hands);
    }
    if(gun.tightenPhase===1&&!gun.tightenDone){waitingFrames++;maxWaitingHandAboveHead=Math.max(maxWaitingHandAboveHead,...gun.hands.map(h=>h[1]-gun.head[1]));}
   }
  }
  Date.now=actualNow;view.dispose();reports.push({role,rearBeforeGo,rearAt450,maxHandStep,maxGripError,waitingFrames,maxWaitingHandAboveHead,scoreUnchanged:JSON.stringify(r)===original});
 }
 return reports;
};
window.showFinalPose=()=>{
 const round=complete('FRONT_JACK',2000),timeline=new TaskAnimationTimeline();timeline.ingestRecorded(round);
 const clock=Math.max(...['FL','FR','RL','RR'].map(c=>timeline.receipt(c+'_GUN_TIGHTEN').endsAt))+250;
 const room={id:round.id,teamId:round.id,solo:true,name:'QA',color:'#f4493b',code:'QA',hostId:'you',status:round.status,players:round.players,round,updatedAt:0};
 const host=document.querySelector('#scene');host.replaceChildren();
 host.style.position='relative';const gpu=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});gpu.setSize(800,600);host.prepend(gpu.domElement);const view=createPitGarageScene(host,{renderer:gpu,manual:true,quality:'low'});if(!view)throw Error('WebGL unavailable');
 window.drawFinalPose=()=>{view.update(room,'you',true,clock);view.render(performance.now());};window.drawFinalPose();return {clock,poses:JSON.parse(host.dataset.gunnerPoses)};
};
window.verifyReadiness=()=>{
 const results=[];
 for(const [role,delay] of [...ROLES.map(role=>[role,36]),['FRONT_JACK',2000]]){
  const r=complete(role,delay),original=JSON.stringify(r),host=document.querySelector('#scene');let clock=9000;
  const renderer={domElement:document.createElement('canvas'),shadowMap:{},render(){},setSize(){},setPixelRatio(){}};
  const view=createPitGarageScene(host,{renderer,manual:true});
  const actualNow=Date.now;Date.now=()=>clock;
  const room={id:r.id,teamId:r.id,solo:true,name:'QA',color:'#f4493b',code:'QA',hostId:'you',status:r.status,players:r.players,round:r,updatedAt:0};
  const clocks=[9000,...new Set(r.events.flatMap(e=>[e.at,e.at+1]))].sort((a,b)=>a-b);
  let checks=0;const failures=[];let fittingReady=null;
  for(clock of clocks){
   const snapshot=structuredClone(room);
   for(const t of snapshot.round.tasks)if(t.completedAt>clock){t.completedAt=null;t.status=t.enabledAt<=clock?'AVAILABLE':'LOCKED';}
   view.update(snapshot,'you',true);view.render(clock);
   const work=JSON.parse(host.dataset.workState),wheels=JSON.parse(host.dataset.wheelWork);
   for(const t of snapshot.round.tasks.filter(t=>t.status==='AVAILABLE'&&t.enabledAt<=clock))for(const id of t.dependencies){
    checks++;const prior=work.find(p=>p.id===id);if(!prior.done||prior.phase!==1)failures.push({clock,task:t.id,parent:id});
    const prefix=id.slice(0,2),wheel=wheels.find(w=>w.corner===prefix);
    if(id.endsWith('_WHEEL_ON')&&(!wheel.hubVisible||wheel.newWheelVisible))failures.push({clock,task:t.id,error:'new wheel missing at tighten eligibility'});
    if(id.endsWith('_LIFT')&&Math.abs(Number(host.dataset[id.startsWith('FRONT')?'frontLift':'rearLift'])-.27)>.001)failures.push({clock,task:t.id,error:'car not lifted at loosen eligibility'});
    if(id.endsWith('_LOWER')&&Math.abs(Number(host.dataset[id.startsWith('FRONT')?'frontLift':'rearLift']))>.001)failures.push({clock,task:t.id,error:'car not lowered at release eligibility'});
   }
   if(role==='FL_GUNNER'&&clock===11472){const p=JSON.parse(host.dataset.oldWheelPlacements).find(p=>p.corner==='FL');fittingReady={clock,hub:wheels.find(w=>w.corner==='FL'),oldWheel:p.pose};}
   if(snapshot.round.tasks.find(t=>t.id==='GREEN_RELEASE').completedAt!==null&&host.dataset.releaseGreen!=='true')failures.push({clock,error:'release signal late'});
   if(snapshot.round.tasks.find(t=>t.id==='GREEN_RELEASE').completedAt===null&&Number(host.dataset.carDeparture)>0)failures.push({clock,error:'car left before release'});
  }
  Date.now=actualNow;view.dispose();results.push({role,checks,failures,fittingReady,scoreUnchanged:JSON.stringify(r)===original});
 }
 return results;
};
</script>
