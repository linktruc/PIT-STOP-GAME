<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}#scene{width:100vw;height:100vh}#you{position:absolute;z-index:5;background:#ffd457;color:#1d2630;font:bold 12px Arial;padding:5px 9px;border-radius:4px;pointer-events:none}</style><div id="scene"><div id="you">YOU</div></div>
<script type="module">
import {createPitGarageScene} from '/src/scene/garage.ts';import {createSoloRound} from '/src/engine.ts';
window.requestAnimationFrame=()=>0;const host=document.querySelector('#scene');let view,frame=0;
const players=[{id:'viewer',role:'REAR_JACK',nickname:'Viewer',ready:true,joinedAt:0},{id:'peer',role:'RELEASE_CONTROLLER',nickname:'Other player',ready:true,joinedAt:1}];
const room={id:'pov',teamId:'pov',name:'Peer POV',color:'#578fff',code:'POV',hostId:'viewer',status:'RUNNING',players,updatedAt:10000,round:createSoloRound(players,1000,'pov-round')};room.round.penalties={peer:{at:10000,until:12000}};
window.initLockout=quality=>{view?.dispose();view=createPitGarageScene(host,{quality,marker:{current:document.querySelector('#you')}});return window.showLockout('overview');};
window.showLockout=(mode,at=11000)=>{
 view.setPlayerCamera(mode);view.update(room,'viewer',true,at);view.render(frame+=100);
 return {mode,crew:JSON.parse(host.dataset.crewHighlights),labels:[...host.querySelectorAll('.crew-lockout-tag')].filter(e=>e.style.display!=='none').map(e=>e.textContent)};
};
</script>
