<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><div id="root"></div>
<script type="module">
window.PIT_CONFIG={hudHostingBadge:'none',enableSoloTest:false};
// Bound software-GPU work in this fixture; CSS layout and game clocks stay real.
Object.defineProperty(window,'devicePixelRatio',{value:.35});
const nativeRaf=window.requestAnimationFrame.bind(window);
window.requestAnimationFrame=callback=>setTimeout(()=>nativeRaf(callback),60);
window.cancelAnimationFrame=id=>clearTimeout(id);
localStorage.setItem('pit-v7-quality','low');localStorage.setItem('pit-v7-muted','true');localStorage.setItem('pit-v7-volume','0');location.hash='crew';
const {api}=await import('/src/api.ts');const callbacks=new Set();
Object.assign(api,{hasBackend:true,isConfigured:true,getState:()=>window.qaRpc('heartbeat',null,{}),getGlobalState:()=>window.qaRpc('heartbeat',null,{}),call:(op,room,payload={})=>window.qaRpc(op,room,payload),recoverSession:async()=>{},subscribe:cb=>{callbacks.add(cb);return()=>callbacks.delete(cb);}});
// Deliberately omit realtime pushes: peers must discover the 2s penalty by polling.
window.qaRefresh=()=>{for(const cb of callbacks)cb();};
await import('/src/main.tsx');
</script>
