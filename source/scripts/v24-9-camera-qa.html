<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}#scene{width:100vw;height:100vh}</style><div id="scene"></div><script type="module">
import {createPitGarageScene} from '/src/scene/garage.ts';
const host=document.querySelector('#scene');let view,clock=10000,role='FL_GUNNER';
window.requestAnimationFrame=()=>0;const inputs=[];for(const type of ['pointerdown','pointermove','pointerup','pointercancel'])host.addEventListener(type,e=>inputs.push({type:e.type,x:e.clientX,y:e.clientY,button:e.button}),true);
window.initCamera=(mode,selectedRole='FL_GUNNER')=>{
 view?.dispose();host.replaceChildren();role=selectedRole;clock=10000;
 const renderer={domElement:document.createElement('canvas'),shadowMap:{},render(){},setSize(){},setPixelRatio(){}};
 view=createPitGarageScene(host,{renderer,quality:'low'});view.setPlayerCamera(mode);return window.advanceCamera(20);
};
window.advanceCamera=(ms=640)=>{
 for(let end=clock+ms;clock<end;clock+=20){view.update({id:'cam',solo:true,color:'#f4493b',players:[{id:'you',role}],round:null},'you',true,clock);view.render(clock);}
 return {camera:JSON.parse(host.dataset.playerCamera),follow:JSON.parse(host.dataset.followCamera),selected:host.querySelector('.crew-tooltip')?.textContent,inputs:inputs.splice(0)};
};
</script>
